<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻訳指摘の判定</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --mute:#6b6a65; --line:#dedcd3; --bad:#b3261e; --ok:#1b6e3c; --mid:#8a6100; --focus:#1a4fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --card:#21211e; --ink:#eceae3; --mute:#a3a198; --line:#3a3934; --bad:#ff8a80; --ok:#7bd39b; --mid:#e6bf5a; --focus:#8fb0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  .count { color:var(--mute); font-variant-numeric: tabular-nums; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:10px 0 18px; overflow:hidden; }
  .bar div { height:100%; background:var(--focus); width:0; transition: width .2s; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .key { font:13px ui-monospace, Menlo, monospace; color:var(--mute); word-break:break-all; }
  dl { margin:14px 0 0; display:grid; grid-template-columns: 7.5em 1fr; gap:12px 14px; }
  dt { color:var(--mute); font-size:13px; padding-top:5px; }
  dd { margin:0; font-size:19px; word-break:break-word; white-space:pre-wrap; }
  dd.shipped { color:var(--bad); font-weight:600; }
  dd.fix { color:var(--ok); }
  dd.why { font-size:15px; color:var(--ink); }
  dd.why small { display:block; color:var(--mute); font-size:13px; margin-top:4px; }
  .buttons { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:18px; }
  button { font:inherit; padding:14px 8px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  button b { display:block; font-size:17px; }
  button span { font-size:12px; color:var(--mute); }
  button.sel { border-color:currentColor; }
  .v-error { color:var(--bad); } .v-unsure { color:var(--mid); } .v-not_error { color:var(--ok); }
  nav { display:flex; justify-content:space-between; margin-top:14px; }
  nav button { padding:8px 14px; border-width:1px; font-size:14px; }
  .sum { margin-top:18px; color:var(--mute); font-size:14px; }
  .err { color:var(--bad); min-height:1.5em; margin-top:8px; }
  @media (max-width:560px) { dl { grid-template-columns:1fr; gap:2px 0; } dt { padding-top:10px; } .buttons { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header><h1>翻訳指摘の判定</h1><span class="count" id="count"></span></header>
  <div class="bar"><div id="bar"></div></div>
  <section class="card" id="card" aria-live="polite"></section>
  <div class="buttons">
    <button class="v-error" data-v="error"><b>誤訳である</b><span>指摘は正しい (1)</span></button>
    <button class="v-unsure" data-v="unsure"><b>どちらとも言えない</b><span>判断できない (2)</span></button>
    <button class="v-not_error" data-v="not_error"><b>問題ない</b><span>余計な指摘 (3)</span></button>
  </div>
  <nav><button id="prev">← 前へ</button><button id="next">次へ →</button></nav>
  <p class="err" id="err" role="alert"></p>
  <p class="sum" id="sum"></p>
  <p class="sum">「出荷されている訳」が、この画面文言の訳として間違っているかを判定してください。修正案の出来は問いません。キーボードの 1 / 2 / 3 で判定、← → で移動できます。判定は押した時点で保存されます。</p>
</main>
<script>
let items = [], verdicts = {}, index = 0;
const $ = id => document.getElementById(id);
const esc = text => String(text).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show() {
  const item = items[index];
  if (!item) { $('card').innerHTML = '<p>指摘がありません。</p>'; return; }
  const why = item.reason_local ? `${esc(item.reason_local)}<small>${esc(item.reason)}</small>` : esc(item.reason);
  $('card').innerHTML = `<div class="key">${esc(item.key)}</div><dl>
    <dt>英語の原文</dt><dd>${esc(item.source)}</dd>
    <dt>出荷されている訳</dt><dd class="shipped">${esc(item.target)}</dd>
    <dt>修正案</dt><dd class="fix">${esc(item.suggestion)}</dd>
    <dt>指摘の理由</dt><dd class="why">${why}</dd></dl>`;
  document.querySelectorAll('.buttons button').forEach(b => b.classList.toggle('sel', verdicts[item.id] === b.dataset.v));
  const judged = Object.keys(verdicts).length;
  $('count').textContent = `${index + 1} / ${items.length} 件目 ・ 判定済み ${judged} 件`;
  $('bar').style.width = `${100 * judged / items.length}%`;
}
function summary(s) {
  const pct = v => v === null ? '-' : `${Math.round(100 * v)}%`;
  $('sum').textContent = `誤訳 ${s.error} ・ 不明 ${s.unsure} ・ 問題ない ${s.not_error} ／ 指摘が正しかった割合 ${pct(s.precision)} (不明を外れ扱いにすると ${pct(s.precision_strict)})`;
}
async function judge(verdict) {
  const item = items[index];
  if (!item) return;
  $('err').textContent = '';
  try {
    const res = await fetch('/api/judge', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: item.id, verdict})});
    if (!res.ok) throw new Error((await res.json()).error || res.status);
    verdicts[item.id] = verdict;
    summary((await res.json()).summary);
    const nextOpen = items.findIndex((it, i) => i > index && !verdicts[it.id]);
    index = nextOpen === -1 ? Math.min(index + 1, items.length - 1) : nextOpen;
    show();
  } catch (e) { $('err').textContent = `保存できませんでした: ${e.message}`; }
}
function move(step) { index = Math.max(0, Math.min(items.length - 1, index + step)); show(); }
document.querySelectorAll('.buttons button').forEach(b => b.addEventListener('click', () => judge(b.dataset.v)));
$('prev').addEventListener('click', () => move(-1));
$('next').addEventListener('click', () => move(1));
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '1') judge('error'); else if (e.key === '2') judge('unsure'); else if (e.key === '3') judge('not_error');
  else if (e.key === 'ArrowLeft') move(-1); else if (e.key === 'ArrowRight') move(1);
});
fetch('/api/items').then(r => r.json()).then(data => {
  items = data.items; verdicts = data.verdicts; summary(data.summary);
  const firstOpen = items.findIndex(it => !verdicts[it.id]);
  index = firstOpen === -1 ? 0 : firstOpen;
  show();
}).catch(e => { $('err').textContent = `読み込めませんでした: ${e.message}`; });
</script>
</body>
</html>
