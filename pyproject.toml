[project]
name = "l10n-sense"
version = "0.1.0"
description = "Find translated UI strings that are wrong in context: rules plus a 0-100 model score using the code as evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
keywords = ["i18n", "l10n", "localization", "translation", "lint", "llm"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Internationalization",
               "Topic :: Software Development :: Quality Assurance"]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.scripts]
l10n-sense = "l10n_sense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l10n_sense"]

# The runtime services ship inside the package; benchmarks, the reviewer and the judging page stay in the repository.
[tool.hatch.build.targets.wheel.force-include]
"services/extract/extract_lib.py" = "l10n_sense/_services/extract/extract_lib.py"
"services/rules/rules_lib.py" = "l10n_sense/_services/rules/rules_lib.py"
"services/score/score_lib.py" = "l10n_sense/_services/score/score_lib.py"
"services/check/check_lib.py" = "l10n_sense/_services/check/check_lib.py"
"services/formats/formats_lib.py" = "l10n_sense/_services/formats/formats_lib.py"
"services/llm/llm.py" = "l10n_sense/_services/llm/llm.py"
"services/llm_codex/codex.py" = "l10n_sense/_services/llm_codex/codex.py"

[tool.hatch.build.targets.sdist]
include = ["l10n_sense", "services", "contracts", "README.md", "LICENSE", "pyproject.toml"]
