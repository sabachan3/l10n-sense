[project]
name = "l10n-sense"
version = "0.1.0"
description = "Find translated UI strings that are wrong in context: rules plus a 0-100 model score using the code as evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sabachan3" }]
dependencies = []
keywords = ["i18n", "l10n", "localization", "translation", "lint", "llm", "gettext", "i18next", "android", "ios"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/sabachan3/l10n-sense"
Repository = "https://github.com/sabachan3/l10n-sense"
Issues = "https://github.com/sabachan3/l10n-sense/issues"
Changelog = "https://github.com/sabachan3/l10n-sense/blob/main/CHANGELOG.md"

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.scripts]
l10n-sense = "l10n_sense.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["l10n_sense"]

# The runtime services ship inside the package; benchmarks, the reviewer and the judging page stay in the repository.
[tool.hatch.build.targets.wheel.force-include]
"services/extract/extract_lib.py" = "l10n_sense/_services/extract/extract_lib.py"
"services/rules/rules_lib.py" = "l10n_sense/_services/rules/rules_lib.py"
"services/score/score_lib.py" = "l10n_sense/_services/score/score_lib.py"
"services/check/check_lib.py" = "l10n_sense/_services/check/check_lib.py"
"services/formats/formats_lib.py" = "l10n_sense/_services/formats/formats_lib.py"
"services/llm/llm.py" = "l10n_sense/_services/llm/llm.py"
"services/llm_codex/codex.py" = "l10n_sense/_services/llm_codex/codex.py"

# The sdist holds what builds the wheel and nothing else: the package, the seven runtime service
# files, the licence, the README and the changelog. Tests, benchmarks and data stay in the
# repository. scripts/e2e.sh compares both archives with these lists, file by file.
[tool.hatch.build.targets.sdist]
only-include = [
    "l10n_sense",
    "services/extract/extract_lib.py",
    "services/rules/rules_lib.py",
    "services/score/score_lib.py",
    "services/check/check_lib.py",
    "services/formats/formats_lib.py",
    "services/llm/llm.py",
    "services/llm_codex/codex.py",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
